<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inicia sesion en ProyectoFootball">
  <title>Iniciar sesion | ProyectoFootball</title>
  <link rel="stylesheet" href="/styles/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-aside" aria-labelledby="welcome-title">
      <div class="brand-mark">ProyectoFootball / 02</div>
      <div class="aside-copy">
        <p class="eyebrow">Tu carrera continua</p>
        <h1 id="welcome-title">Vuelve al campo.</h1>
        <p>Retoma tu temporada, revisa tu progreso y prepara el siguiente partido.</p>
      </div>
      <p class="aside-note">Tu vestuario te espera.</p>
    </section>

    <section class="login-panel" aria-labelledby="form-title">
      <div class="form-frame">
        <p class="form-kicker">Cuenta de jugador</p>
        <h2 id="form-title">Inicia sesion</h2>
        <p class="form-intro">Introduce tus credenciales para continuar.</p>

        <form id="login-form" onsubmit="return false;" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="alex@ejemplo.com" required aria-describedby="email-error">
            <p class="field-error" id="email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Contrasena</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
            <p class="field-error" id="password-error" role="alert"></p>
          </div>

          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          <button class="submit-button" id="submit-button" type="submit">
            <span id="submit-label">Entrar al vestuario</span>
          </button>
        </form>

        <p class="register-link">¿Aun no tienes cuenta? <a href="/registro">Crea tu perfil</a></p>
      </div>
    </section>
  </main>
  <script type="module" src="/ui/login.js"></script>
</body>
</html>
