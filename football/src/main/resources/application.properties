spring.application.name=football
spring.datasource.url=jdbc:postgresql://localhost:5432/football
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=PostgreSQL17
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.session.secret=${APP_SESSION_SECRET:dev-only-session-secret-change-before-production-2026}
app.session.duration=PT8H
app.session.inactivity-timeout=PT2H
app.session.secure-cookie=false
app.jwt.secret=${APP_JWT_SECRET:dev-only-jwt-secret-change-before-production-2026-should-be-at-least-32-chars}
app.jwt.expiration=86400000
